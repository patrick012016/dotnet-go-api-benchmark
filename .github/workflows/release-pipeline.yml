name: .NET GO API CI/CD and release pipeline

on:
  #  Uruchom automatycznie przy wrzuceniu kodu na gałąź main
  #  Trigger automatically on push to the main branch
  push:
    branches: [ "master" ]
    paths-ignore:
      #- "**.md"
      - "**/Dockerfile"
      #- ".github/workflows/**"
  
  #  Uruchom przy otwarciu Pull Requesta, aby sprawdzić zmiany przed scaleniem
  #  Trigger on Pull Request to verify changes before merging
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      #- "**.md"
      - "**/Dockerfile"
      #- ".github/workflows/**"
  
  #  Pozwala ręcznie uruchomić workflow i wygenerować wydanie aplikacji
  #  Allows manual workflow trigger to generate an application Release
  workflow_dispatch:
    inputs:
      version:
        description: "Version example (1.0.0)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  #  ETAP 1: Testy jednostkowe i code coverage
  #  STAGE 1: Unit tests and code coverage
  # ----------------------------------------------------------------
  unit-tests:
    name: Unit tests and code coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      # Uruchomienie testów MTP w konfiguracji Release wraz z generowaniem raportu pokrycia kodu
      # Run MTP tests in Release configuration with Cobertura code coverage
      - name: Run unit tests
        run: |
          dotnet test ./tests/Api.UnitTest/Api.UnitTest.csproj \
          -c Release \
          -- \
          --results-directory ${{ github.workspace }}/TestResults \
          --report-trx \
          --report-trx-filename test-results.trx \
          --coverage \
          --coverage-output-format cobertura \
          --coverage-output coverage.cobertura.xml
      
      # Zapisanie wyników i pokrycia jako artefakty
      # Saving results and coverage as artifacts
      - name: Upload test results artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-results-and-coverage
          path: |
            ${{ github.workspace }}/TestResults/*.trx
            ${{ github.workspace }}/TestResults/*.xml
          retention-days: 14
  
  # ----------------------------------------------------------------
  #  ETAP 2: Publikacja i weryfikacja (AOT & JIT)
  #  STAGE 2: Publish and verification
  # ----------------------------------------------------------------
  publish-verification:
    name: Publish verify (${{ matrix.project }})
    needs: unit-tests
    runs-on: ubuntu-latest
    
    strategy:
      #  Macierz sprawia, że GitHub uruchamia to zadanie równolegle dla AOT i JIT
      #  The matrix ensures GitHub runs this job in parallel for AOT and JIT
      matrix:
        project: [ Api.Aot, Api.Jit ]
        include:
          - project: Api.Aot
            path: "./src/Api.Aot"
          - project: Api.Jit
            path: "./src/Api.Jit"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      #  Pamięć podręczna dla pakietów NuGet przyspiesza kolejne buildy
      #  Caching NuGet packages speeds up subsequent builds
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Instalacja zależności dla AOT
      # Installing dependencies for AOT 
      - name: Install Native AOT Build Prerequisites (Linux)
        if: ${{ matrix.project == 'Api.Aot' }}
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Weryfikacja JIT: Pełny publish ze spójnymi flagami z Dockerfile
      # JIT Verification: Full publish with consistent flags from Dockerfile
      - name: Publish project (JIT)
        if: ${{ matrix.project == 'Api.Jit' }}
        working-directory: ${{ matrix.path }}
        run: dotnet publish -c Release -p:TreatWarningsAsErrors=true /p:UseAppHost=false

      # Weryfikacja AOT: Pełny publish z weryfikacją trimowania
      # AOT Verification: Full Publish with Trim Verification
      - name: Publish and Verify AOT Compatibility
        if: ${{ matrix.project == 'Api.Aot' }}
        working-directory: ${{ matrix.path }}
        run: dotnet publish -c Release -p:TreatWarningsAsErrors=true /p:PublishAot=true

  # ----------------------------------------------------------------
  #  ETAP 3: Budowanie kontenerów Docker i weryfikacja
  #  STAGE 3: Docker containers build and verification
  # ----------------------------------------------------------------
  docker-integration:
    name: Docker build and run
    
    #  Wymaga, aby etap kompilacji zakończył się sukcesem
    #  Requires the build stage to complete successfully
    needs: publish-verification
    runs-on: ubuntu-latest
    
    #  Rejestruje to jako "Wdrożenie" na GitHubie
    #  Registers this as a "Deployment" on GitHub
    environment:
      name: Staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      #  Budowanie i uruchamianie obrazów Docker na podstawie docker-compose.yml
      #  Building and run Docker images based on docker-compose.yml
      - name: Build Docker images
        working-directory: ./src
        env:
          IMAGE_TAG: ${{ inputs.version || 'latest'}}
          API_AOT_PORT: ${{ secrets.API_AOT_PORT }}
          API_JIT_PORT: ${{ secrets.API_JIT_PORT }}

        run: docker compose build

      - name: Run containers
        working-directory: ./src
        env:
          IMAGE_TAG: ${{ inputs.version || 'latest'}}
          API_AOT_PORT: ${{ secrets.API_AOT_PORT }}
          API_JIT_PORT: ${{ secrets.API_JIT_PORT }}

        run: docker compose up -d
      
      #  Zrzut logów kontenerów (uruchamiany nawet, jeśli Healthcheck zgłosi błąd)
      #  Dumping container logs (runs even if the Healthcheck fails)
      - name: Export Docker logs
        working-directory: ./src
        if: failure()
        run: docker compose logs > infrastructure-logs.txt

      #  Zapisanie pliku logów jako artefaktu do późniejszej analizy
      #  Saving the log file as an artifact for later analysis
      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Docker-Runtime-Logs
          path: infrastructure-logs.txt
